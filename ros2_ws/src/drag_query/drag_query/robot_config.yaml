# Robot footprint
robot_width: 2.0  # meters - width of the robot
robot_length: 3.0  # meters - length of the robot
water_density: 1025.0  # kg/m^3 - seawater density

# Hull damping coefficients. Must match the vrx::SimpleHydrodynamics plugin
# (vrx_urdf/wamv_gazebo/urdf/dynamics/wamv_gazebo_dynamics_plugin.xacro) so the
# current force cancels VRX's still-water damping exactly.
xU: 100.0   # N/(m/s)      surge linear
xUU: 150.0  # N/(m/s)^2    surge quadratic
yV: 100.0   # N/(m/s)      sway linear
yVV: 100.0  # N/(m/s)^2    sway quadratic
