# Robot footprint and drag properties
robot_width: 2.0  # meters - width of the robot
robot_length: 3.0  # meters - length of the robot
water_density: 1025.0  # kg/m^3 - seawater density

# Directional drag coefficients
cx: 0.8  # drag coefficient in x-direction (longitudinal)
cy: 1.2  # drag coefficient in y-direction (lateral)

# Reference areas for drag calculation
Ax: 0.1425  # m^2 - reference area in x-direction (length * average height)
Ay: 0.25  # m^2 - reference area in y-direction (width * average height)
